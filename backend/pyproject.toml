[project]
name = "backend"
version = "0.1.0"
description = "BMad Portal Backend (FastAPI)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.19.0",
    "bcrypt>=4.2.1",
    "cryptography>=44.0.0",
    "fastapi==0.141.*",
    "pyjwt>=2.10.1",
    "psycopg[binary]>=3.3.4",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.52.1",
    "websockets>=17,<18",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
